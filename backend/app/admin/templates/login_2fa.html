{% extends "base.html" %}
{% block title %}Second step{% endblock %}
{% block content %}
<div class="login card">
  <h1>Second step</h1>
  <p class="hint">Open your authenticator app and type the 6-digit code for Vendor Gateway.</p>
  <form method="post" action="/admin/login/2fa" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="pending" value="{{ pending }}">
    <label for="code">Code</label>
    <input id="code" type="text" name="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" required autofocus>
    <p><button type="submit">Log in</button></p>
  </form>
</div>
{% endblock %}
